<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>测一下你应该去哪里生活？</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; min-height: 100vh; overflow-x: hidden; }

  #page-input {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.95); border-radius: 20px;
    padding: 40px; max-width: 500px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; color: #764ba2; margin-bottom: 10px; font-size: 26px; }
  .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }
  .form-group { margin-bottom: 18px; }
  label { display: block; color: #555; margin-bottom: 6px; font-weight: bold; }
  input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; }
  input:focus { outline: none; border-color: #764ba2; }
  .word-inputs { display: flex; gap: 10px; }
  .word-inputs input { text-align: center; font-size: 18px; }
  button {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white; border: none; border-radius: 10px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    margin-top: 10px; transition: transform 0.2s;
  }
  button:hover { transform: translateY(-2px); }

  #page-result {
    display: none; min-height: 100vh;
    background: radial-gradient(ellipse at center, #050816 0%, #000005 100%);
    position: relative; padding: 25px 0 30px;
  }
  .stars {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 70%, #fff, transparent),
      radial-gradient(2px 2px at 50% 40%, #fff, transparent),
      radial-gradient(1px 1px at 70% 80%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 85% 15%, #fff, transparent),
      radial-gradient(1px 1px at 15% 85%, #fff, transparent),
      radial-gradient(1px 1px at 95% 60%, #fff, transparent);
    opacity: 0.5; animation: twinkle 4s infinite alternate;
  }
  @keyframes twinkle { from {opacity:0.3} to {opacity:0.7} }

  .result-content {
    position: relative; z-index: 2;
    max-width: 1100px; margin: 0 auto;
    padding: 0 20px; color: #fff; text-align: center;
  }
  .greeting {
    font-size: 14px; color: #b8c4ff;
    letter-spacing: 4px; margin-bottom: 15px;
    opacity: 0; animation: fadeUp 0.8s 0.2s forwards;
  }

  .map-wrap {
    position: relative; width: 100%;
    max-width: 900px;
    aspect-ratio: 2 / 1;
    margin: 0 auto 15px;
    opacity: 0; animation: fadeUp 1s 0.5s forwards;
  }
  .map-svg { width: 100%; height: 100%; display: block; }
  .map-svg .country {
    fill: #0d1a3d;
    stroke: #2a4a8a;
    stroke-width: 0.4;
    transition: fill 0.3s;
  }
  .map-svg .country.highlight {
    fill: #4a7fd6;
    filter: drop-shadow(0 0 8px rgba(120,180,255,0.8));
  }

  .pin {
    position: absolute;
    transform: translate(-50%, -100%);
    pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
  }
  .city-label {
    font-size: clamp(20px, 4vw, 48px);
    font-weight: 900; letter-spacing: 4px; color: #fff;
    white-space: nowrap;
    text-shadow:
      0 0 10px rgba(180,220,255,0.95),
      0 0 25px rgba(120,180,255,0.8),
      0 0 50px rgba(80,150,255,0.6);
    margin-bottom: 6px;
    opacity: 0; animation: glow 0.9s 1s forwards;
  }
  @keyframes glow {
    from { opacity: 0; transform: scale(0.7); filter: blur(8px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .pin-line {
    width: 1.5px; height: clamp(30px, 6vw, 60px);
    background: linear-gradient(to bottom, rgba(180,220,255,0.95), rgba(180,220,255,0.3));
    box-shadow: 0 0 6px rgba(180,220,255,0.8);
    opacity: 0; animation: fadeUp 0.5s 1.4s forwards;
  }
  .pin-dot {
    width: 10px; height: 10px; border-radius: 50%; background: #fff;
    box-shadow:
      0 0 10px #fff,
      0 0 20px rgba(180,220,255,0.9),
      0 0 40px rgba(120,180,255,0.7);
    opacity: 0;
    animation: pulse 1.5s 1.6s infinite, popIn 0.4s 1.6s forwards;
  }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }
  @keyframes popIn { from{opacity:0} to{opacity:1} }

  .info-block {
    max-width: 600px; margin: 0 auto;
    opacity: 0; animation: fadeUp 0.8s 1.8s forwards;
  }
  .country-line { font-size: 18px; color: #d8e4ff; letter-spacing: 3px; margin-bottom: 15px; }
  .country-line strong { color: #fff; }
  .description {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 15px; padding: 20px 25px;
    color: #e8edff; font-size: 15px; line-height: 1.8;
    letter-spacing: 1px; text-align: left;
  }
  .description .highlight { color: #aac8ff; font-weight: bold; }
  .meta {
    display: flex; justify-content: center; gap: 25px;
    margin-top: 15px; flex-wrap: wrap;
    font-size: 13px; color: #8a96c8; letter-spacing: 1px;
  }
  .meta span strong { color: #cfd8ff; }
  .footer-text { margin-top: 18px; color: #6c7898; font-size: 12px; letter-spacing: 1px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .back-btn {
    position: fixed; top: 15px; left: 15px; z-index: 10;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff; padding: 9px 18px;
    border-radius: 30px; font-size: 13px;
    cursor: pointer; width: auto; margin-top: 0;
    letter-spacing: 1px; transition: all 0.3s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.2); transform: translateX(-3px); }

  .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #8a96c8; font-size: 14px;
  }
</style>
</head>
<body>

<div id="page-input">
  <div class="container">
    <h1>✨ 测一下你应该去哪里生活？ ✨</h1>
    <p class="subtitle">凭直觉，告诉你最适合的城市</p>
    <div class="form-group">
      <label>姓名</label>
      <input type="text" id="name" placeholder="例如：狄仁杰">
    </div>
    <div class="form-group">
      <label>生日 (MM/DD)</label>
      <input type="text" id="birthday" placeholder="例如：05/21" maxlength="5">
    </div>
    <div class="form-group">
      <label>第一反应的三个字（凭直觉！）</label>
      <div class="word-inputs">
        <input type="text" id="w1" maxlength="2" placeholder="字1">
        <input type="text" id="w2" maxlength="2" placeholder="字2">
        <input type="text" id="w3" maxlength="2" placeholder="字3">
      </div>
    </div>
    <button onclick="play()">🌍 快来看一下吧！</button>
  </div>
</div>

<div id="page-result">
  <div class="stars"></div>
  <button class="back-btn" onclick="goBack()">← 返回</button>
  <div class="result-content">
    <div class="greeting" id="greeting"></div>
    <div class="map-wrap" id="mapWrap">
      <svg class="map-svg" id="mapSvg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="pin" id="pin">
        <div class="city-label" id="cityLabel"></div>
        <div class="pin-line"></div>
        <div class="pin-dot"></div>
      </div>
      <div class="loading" id="mapLoading">地图加载中…</div>
    </div>
    <div class="info-block">
      <div class="country-line">🌍 <strong id="countryName"></strong></div>
      <div class="description" id="description"></div>
      <div class="meta">
        <span>星座：<strong id="zodiacText"></strong></span>
        <span>气质倾向：<strong id="catText"></strong></span>
      </div>
      <p class="footer-text">✦ 这只是趣味游戏，未来仍充满无限可能 ✦</p>
    </div>
  </div>
</div>

<script>

  const z = [[1,20,'摩羯'],[2,19,'水瓶'],[3,21,'双鱼'],[4,20,'白羊'],
    [5,21,'金牛'],[6,22,'双子'],[7,23,'巨蟹'],[8,23,'狮子'],
    [9,23,'处女'],[10,23,'天秤'],[11,22,'天蝎'],[12,22,'射手'],[12,31,'摩羯']];
  for (let i=0;i<z.length;i++) if (m<z[i][0]||(m===z[i][0]&&d<=z[i][1])) return z[i][2];
  return '摩羯';
}

  modern:['快','高','新','电','梦','创','变','潮','动','忙','未','科','技','大','金','闪','炫','酷','摩','都'],

const db = {
  '火': {
    nature: [
      {c:'澳大利亚',cn:'悉尼',city:'SYDNEY',lat:-33.87,lng:151.21,

      {c:'巴西',cn:'里约热内卢',city:'RIO',lat:-22.91,lng:-43.17,

      {c:'澳大利亚',cn:'凯恩斯',city:'CAIRNS',lat:-16.92,lng:145.78,
       desc:'<span class="highlight">凯恩斯</span>是大堡礁与热带雨林交织的冒险之城。潜入海底与彩色珊瑚共舞，跳出飞机俯瞰世界，在丹翠雨林听亿万年前的鸟鸣。这里属于不愿安分的人——而你，就是那种眼里有光、脚下有路的人。'}
    ],
    culture: [
      {c:'意大利',cn:'罗马',city:'ROMA',lat:41.90,lng:12.50,

      {c:'巴西',cn:'圣保罗',city:'SAO PAULO',lat:-23.55,lng:-46.63,

      {c:'澳大利亚',cn:'墨尔本',city:'MELBOURNE',lat:-37.81,lng:144.96,

    comfort: [

      {c:'西班牙',cn:'塞维利亚',city:'SEVILLA',lat:37.39,lng:-5.99,
       desc:'<span class="highlight">塞维利亚</span>是 flamenco 的诞生地，是橙花香气飘满街道的安达卢西亚明珠。白天躲进 tapas 小馆和 sangria 共度，夜晚在月光下的广场看舞者跺响地板。属于你的，是这种炽热又慵懒的南欧节奏。'}
    ]
  },
  '土': {
    nature: [
      {c:'瑞士',cn:'采尔马特',city:'ZERMATT',lat:46.02,lng:7.75,
       desc:'<span class="highlight">采尔马特</span>是马特洪峰脚下的童话小镇。没有汽车，只有马车、雪橇和登山靴的脚步声。冬天滑雪、夏天徒步，木屋餐厅里有热腾腾的奶酪火锅。你那需要被自然治愈的稳重灵魂，会在这里找到节奏。'},
      {c:'加拿大',cn:'班夫',city:'BANFF',lat:51.18,lng:-115.57,
       desc:'<span class="highlight">班夫</span>是落基山脉的明珠。露易丝湖如绿松石般纯净倒映雪山，森林里随时可能遇见麋鹿与黑熊。这里的"慢"是大自然的节奏——日出徒步、午后温泉、夜晚仰望银河。你需要这种"被山水包围"的稳定感。'},
      {c:'瑞士',cn:'卢塞恩',city:'LUZERN',lat:47.05,lng:8.31,
       desc:'<span class="highlight">卢塞恩</span>是瑞士最优雅的湖滨小城。卡贝尔木桥已横跨600余年，皮拉图斯山顶的云海每天都不重样。坐齿轮火车上山，乘游船游湖，回到老城吃一顿巧克力火锅——这就是品质生活的模样。'}

    modern: [
      {c:'日本',cn:'东京',city:'TOKYO',lat:35.68,lng:139.65,

      {c:'加拿大',cn:'多伦多',city:'TORONTO',lat:43.65,lng:-79.38,
       desc:'<span class="highlight">多伦多</span>是北美最多元的现代都市。CN 塔俯瞰着金融中心，唐人街、小意大利、希腊城各有风味，安大略湖边有最适合散步的步道。生活舒适、机会丰富、节奏不疾不徐——很适合你这种稳健向前的人。'}

function classifyWords(words) {
  const scores = {nature:0, culture:0, modern:0, comfort:0};
  const text = words.join('');
  for (const ch of text) for (const cat in categories)
    if (categories[cat].includes(ch)) scores[cat]++;
  let best='nature', max=-1;
  for (const cat in scores) if (scores[cat]>max){max=scores[cat];best=cat;}
  return max===0 ? null : best;
}

const MAP_W = 1000, MAP_H = 500;
const projection = d3.geoEquirectangular()
  .scale(MAP_W / (2 * Math.PI))
  .translate([MAP_W / 2, MAP_H / 2]);
const pathGen = d3.geoPath(projection);

let mapLoaded = false;
let pendingPick = null;

const MAP_URLS = [
  'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
  'https://fastly.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
  'https://gcore.jsdelivr.net/npm/world-atlas@2/countries-110m.json'
];

async function loadMap() {
  for (const url of MAP_URLS) {
    try {
      const world = await d3.json(url);
      if (world) { renderMap(world); return; }
    } catch(e) { console.warn('Failed:', url); }
  }
  document.getElementById('mapLoading').textContent = '地图加载失败，请检查网络';
}

function renderMap(world) {
  const countries = topojson.feature(world, world.objects.countries).features;
  const svg = d3.select('#mapSvg');
  svg.selectAll('path')
    .data(countries)
    .enter()
    .append('path')
    .attr('class', 'country')
    .attr('d', pathGen)
    .attr('data-name', d => d.properties.name);
  document.getElementById('mapLoading').style.display = 'none';
  mapLoaded = true;
  if (pendingPick) { placePin(pendingPick); pendingPick = null; }
}

function placePin(pick) {
  d3.selectAll('#mapSvg .country').classed('highlight', false);
  const nameMap = {
    '澳大利亚':'Australia','巴西':'Brazil','意大利':'Italy','西班牙':'Spain',
    '瑞士':'Switzerland','加拿大':'Canada','日本':'Japan','法国':'France',
    '荷兰':'Netherlands','美国':'United States of America','德国':'Germany',
    '英国':'United Kingdom','新西兰':'New Zealand','挪威':'Norway',
    '希腊':'Greece','葡萄牙':'Portugal'
  };
  const enName = nameMap[pick.c];
  if (enName) d3.select(`#mapSvg .country[data-name="${enName}"]`).classed('highlight', true);
  const [px, py] = projection([pick.lng, pick.lat]);
  const pin = document.getElementById('pin');
  pin.style.left = (px / MAP_W * 100) + '%';
  pin.style.top = (py / MAP_H * 100) + '%';
}

loadMap();

function play() {
  const name = document.getElementById('name').value.trim();
  const bd = document.getElementById('birthday').value.trim();
  const w1 = document.getElementById('w1').value.trim();
  const w2 = document.getElementById('w2').value.trim();
  const w3 = document.getElementById('w3').value.trim();
  if (!name||!bd||!w1||!w2||!w3) { alert('请填写所有信息哦~'); return; }
  const parts = bd.split('/');
  if (parts.length!==2) { alert('生日格式应为 MM/DD'); return; }
  const m=parseInt(parts[0]), d=parseInt(parts[1]);
  if (!m||!d) { alert('生日格式有误'); return; }
  
  const zodiac = getZodiac(m,d);
  const elem = elementMap[zodiac];
  let cat = classifyWords([w1,w2,w3]);
  if (!cat) {
    const cats=['nature','culture','modern','comfort'];
    cat = cats[Math.floor(Math.random()*cats.length)];
  }
  const list = db[elem][cat];
  const pick = list[Math.floor(Math.random()*list.length)];
  const catName = {nature:'自然户外',culture:'文化艺术',modern:'现代活力',comfort:'舒适闲逸'}[cat];
  
  document.getElementById('greeting').textContent = `${name.toUpperCase()}，你的灵魂归宿是`;
  document.getElementById('cityLabel').textContent = pick.city;
  document.getElementById('countryName').textContent = `${pick.c} · ${pick.cn}`;
  document.getElementById('description').innerHTML = pick.desc;
  document.getElementById('zodiacText').textContent = `${zodiac}座（${elem}象）`;
  document.getElementById('catText').textContent = catName;
  
  if (mapLoaded) placePin(pick);
  else pendingPick = pick;
  
  document.getElementById('page-input').style.display = 'none';
  document.getElementById('page-result').style.display = 'block';
  window.scrollTo(0,0);
  
  document.querySelectorAll('#page-result .greeting, #page-result .map-wrap, #page-result .city-label, #page-result .pin-line, #page-result .pin-dot, #page-result .info-block').forEach(el=>{
    el.style.animation='none'; el.offsetHeight; el.style.animation='';
  });
}

function goBack() {
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-input').style.display='flex';
  window.scrollTo(0,0);
}
document.addEventListener('keypress', e => {
  if (e.key==='Enter' && document.getElementById('page-input').style.display!=='none') play();
});
